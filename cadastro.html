<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adote - Patas Amigas</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header>
        <h1>ONG Patas Amigas</h1>
        <p>Faça parte da nossa missão de ajudar os animais!</p>
    </header>

    <main>
    
        <h1>Cadastro</h1>

        <p>
            Preencha seus dados.
        </p>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="123.456.789-00"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="\([0-9]{2}\) 9[0-9]{4}-[0-9]{4}"
                    placeholder="(11) 91234-5678"
                    required
                >

                <br><br>

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </fieldset>

            <br>

            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{5}-?[0-9]{3}"
                    placeholder="12345-678"
                    required
                >

                <br><br>

                <label for="cidade">Cidade:</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <br><br>

                <label for="estado">Estado:</label>

                <select
                    id="estado"
                    name="estado"
                    required
                >
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>

            </fieldset>

            <br>

            <button type="submit">
                Enviar cadastro
            </button>

        </form>

    </main>

</body>
</html>
